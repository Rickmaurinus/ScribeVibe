[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "scribevibe"
version = "1.0.0"
description = "GPU-accelerated push-to-talk transcription for Windows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.3,<2",
    "numpy>=1.26.4,<3",
    "sounddevice>=0.5.5,<1",
    "soxr>=1.0.0,<2",
    "PySide6>=6.6.0,<7",
    "pyqtgraph>=0.13.3,<1",
    "pywin32>=311",
    "Pillow>=10.0.0,<13",
    # torch must be installed separately with the CUDA wheel index — see requirements.txt
]

[project.scripts]
scribevibe = "main:main"
scribevibe-select-mic = "select_mic:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

# NOTE: flat layout — all modules live at the project root.
# A future src/scribevibe/ migration would require updating all imports.
[tool.setuptools]
py-modules = [
    "main",
    "config",
    "paths",
    "transcriber",
    "audio_capture",
    "key_hook",
    "recording_session",
    "transcription_worker",
    "interface",
    "output_handler",
    "tray_app",
    "history_ui",
    "language_overlay",
    "recording_indicator",
    "select_mic",
]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, B = bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — formatter handles length separately
    "E741",   # ambiguous variable name (l, O, I) — ctypes code uses these
    "UP007",  # use X | Y instead of Optional[X] — gradual migration
]

[tool.ruff.lint.isort]
known-first-party = [
    "config", "paths", "transcriber", "audio_capture",
    "key_hook", "recording_session", "transcription_worker",
    "interface", "output_handler", "tray_app", "history_ui",
    "language_overlay", "recording_indicator", "select_mic",
]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # faster-whisper, sounddevice, pywin32 have no stubs
warn_unused_ignores = true
# Baseline: check_untyped_defs only; tighten toward disallow_untyped_defs over time
check_untyped_defs = true
exclude = ["venv/", "build/", "dist/"]
